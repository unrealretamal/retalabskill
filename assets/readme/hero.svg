<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Retalab Skill — Design interfaces with intent</title>
  <desc id="desc">An original vector illustration of interface design tokens, a UX review, and an approved state, alongside Retalab Skill's three modes.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0f4fb"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#27324b"/>
      <stop offset="1" stop-color="#171d2a"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#1c2940" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#paper)"/>
  <path d="M0 324H1200" stroke="#dce4f0"/>
  <path d="M660 0V420" stroke="#dce4f0" stroke-dasharray="3 8"/>
  <circle cx="1115" cy="54" r="4" fill="#315cda"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="58" y="58" fill="#315cda" font-size="16" font-weight="700" letter-spacing="2.1">RETALAB  /  UI/UX SKILL</text>
    <text x="58" y="145" fill="#151a24" font-size="59" font-weight="750" letter-spacing="-2.7">Design systems.</text>
    <text x="58" y="211" fill="#151a24" font-size="59" font-weight="750" letter-spacing="-2.7">No borrowed taste.</text>
    <text x="60" y="256" fill="#566174" font-size="21">Style-neutral guidance for AI coding agents.</text>
    <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" font-weight="600">
      <rect x="58" y="278" width="104" height="30" rx="15" fill="#eaf0ff"/><text x="78" y="298" fill="#244899">DESIGN</text>
      <rect x="172" y="278" width="104" height="30" rx="15" fill="#eaf0ff"/><text x="196" y="298" fill="#244899">REVIEW</text>
      <rect x="286" y="278" width="100" height="30" rx="15" fill="#eaf0ff"/><text x="309" y="298" fill="#244899">GUIDE</text>
    </g>
    <text x="58" y="371" fill="#6b7483" font-size="14">10 universal UX rules  ·  8 optional style families</text>
    <text x="58" y="395" fill="#8992a0" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="1.1">LISTEN FIRST / DESIGN WITH INTENT</text>
  </g>

  <!-- Project-native proof: a design canvas flowing into a prioritized UX review. -->
  <g filter="url(#soft-shadow)">
    <rect x="704" y="38" width="428" height="320" rx="20" fill="url(#board)"/>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
    <circle cx="729" cy="60" r="4" fill="#ff7777"/><circle cx="744" cy="60" r="4" fill="#f4c86a"/><circle cx="759" cy="60" r="4" fill="#72d7a1"/>
    <text x="786" y="64" fill="#aab5ca" font-size="11" letter-spacing="1">REVIEW_CANVAS</text>
    <text x="1084" y="64" fill="#8290a8" font-size="10">01 / 03</text>
  </g>
  <path d="M724 78H1112" stroke="#ffffff" stroke-opacity=".13"/>

  <g>
    <rect x="726" y="96" width="182" height="238" rx="12" fill="#fbfcff"/>
    <text x="744" y="120" fill="#667185" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing=".8">DESIGN_TOKENS</text>
    <text x="744" y="153" fill="#1c2331" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19" font-weight="700">Clear by design.</text>
    <text x="744" y="174" fill="#778194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11">A system shaped around your users.</text>
    <rect x="744" y="190" width="144" height="1" fill="#e5e9f1"/>
    <text x="744" y="211" fill="#586478" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9">COLOR / ACCENT</text>
    <rect x="744" y="220" width="25" height="25" rx="7" fill="#315cda"/>
    <rect x="775" y="220" width="25" height="25" rx="7" fill="#eaf0ff"/>
    <rect x="806" y="220" width="25" height="25" rx="7" fill="#172033"/>
    <rect x="744" y="258" width="144" height="31" rx="8" fill="#315cda"/>
    <text x="765" y="278" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="600">Save changes</text>
    <circle cx="876" cy="274" r="5" fill="#ffffff" fill-opacity=".85"/>
    <text x="744" y="312" fill="#315cda" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9">STATE: READY</text>
  </g>

  <g>
    <rect x="924" y="96" width="186" height="238" rx="12" fill="#ffffff"/>
    <text x="942" y="120" fill="#667185" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing=".8">UX_REVIEW</text>
    <text x="942" y="151" fill="#1c2331" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="700">Next best fixes</text>
    <rect x="942" y="165" width="150" height="44" rx="8" fill="#fff4f3" stroke="#f4d7d4"/>
    <circle cx="958" cy="187" r="5" fill="#d64e4e"/>
    <text x="971" y="184" fill="#963939" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9" font-weight="700">P0 · PRIMARY ACTION</text>
    <text x="971" y="198" fill="#6d5860" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9">Make next step visible.</text>
    <rect x="942" y="217" width="150" height="44" rx="8" fill="#fff8e9" stroke="#f0e0b7"/>
    <circle cx="958" cy="239" r="5" fill="#cf9223"/>
    <text x="971" y="236" fill="#805d1c" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9" font-weight="700">P1 · INLINE FEEDBACK</text>
    <text x="971" y="250" fill="#6d624f" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9">Explain how to recover.</text>
    <rect x="942" y="273" width="150" height="43" rx="8" fill="#edf8f1" stroke="#d6eddf"/>
    <circle cx="958" cy="294" r="5" fill="#2d9656"/>
    <text x="971" y="291" fill="#276641" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9" font-weight="700">VERIFIED</text>
    <text x="971" y="305" fill="#5b7062" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9">Success state is clear.</text>
  </g>
  <rect x="704.5" y="38.5" width="427" height="319" rx="19.5" fill="none" stroke="#b9c6dc" stroke-opacity=".7"/>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" font-weight="600" letter-spacing=".5">
    <rect x="718" y="371" width="129" height="25" rx="12.5" fill="#ffffff" stroke="#dce4f0"/>
    <text x="733" y="387" fill="#39465b">TOKENS → UI</text>
    <text x="1010" y="387" fill="#8992a0">STYLE_NEUTRAL</text>
  </g>
</svg>
