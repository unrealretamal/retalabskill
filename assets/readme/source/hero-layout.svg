<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">RetaLab Skill — Design without borrowed taste</title>
  <desc id="desc">An editorial README hero for RetaLab Skill, pairing its promise with a generated still life of layered interface-design materials.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5fb"/>
    </linearGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7f8fb" stop-opacity="0"/>
      <stop offset="0.58" stop-color="#f7f8fb" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#f7f8fb" stop-opacity="0.2"/>
    </linearGradient>
    <clipPath id="art-window"><rect x="690" y="20" width="488" height="380" rx="28"/></clipPath>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#paper)"/>
  <path d="M0 324H1200" stroke="#dce4f0" stroke-width="1"/>
  <path d="M660 0V420" stroke="#dce4f0" stroke-width="1" stroke-dasharray="3 8"/>
  <circle cx="1115" cy="54" r="4" fill="#315cda"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="58" y="58" fill="#315cda" font-size="16" font-weight="700" letter-spacing="2.1">RETALAB  /  UI/UX SKILL</text>
    <text x="58" y="145" fill="#151a24" font-size="59" font-weight="750" letter-spacing="-2.7">Design systems.</text>
    <text x="58" y="211" fill="#151a24" font-size="59" font-weight="750" letter-spacing="-2.7">No borrowed taste.</text>
    <text x="60" y="256" fill="#566174" font-size="21" font-weight="400">Style-neutral guidance for AI coding agents.</text>
    <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" font-weight="600">
      <rect x="58" y="278" width="104" height="30" rx="15" fill="#eaf0ff"/>
      <text x="78" y="298" fill="#244899">DESIGN</text>
      <rect x="172" y="278" width="104" height="30" rx="15" fill="#eaf0ff"/>
      <text x="196" y="298" fill="#244899">REVIEW</text>
      <rect x="286" y="278" width="100" height="30" rx="15" fill="#eaf0ff"/>
      <text x="309" y="298" fill="#244899">GUIDE</text>
    </g>
    <text x="58" y="371" fill="#6b7483" font-size="14">10 universal UX rules  ·  8 optional style families</text>
    <text x="58" y="395" fill="#8992a0" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="1.1">LISTEN FIRST / DESIGN WITH INTENT</text>
  </g>
  <rect x="690" y="20" width="488" height="380" rx="28" fill="#e8edf5"/>
  <g clip-path="url(#art-window)">
    <image x="670" y="-2" width="560" height="466" preserveAspectRatio="xMidYMid slice" xlink:href="hero-subject.png"/>
    <rect x="690" y="20" width="488" height="380" fill="url(#veil)"/>
  </g>
  <rect x="690.5" y="20.5" width="487" height="379" rx="27.5" fill="none" stroke="#d7dfeb"/>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="600" letter-spacing="0.8">
    <rect x="1018" y="40" width="132" height="30" rx="15" fill="#ffffff" fill-opacity="0.92" stroke="#dce4f0"/>
    <text x="1034" y="59" fill="#39465b">STYLE_NEUTRAL</text>
    <rect x="714" y="357" width="142" height="27" rx="13.5" fill="#ffffff" fill-opacity="0.94" stroke="#dce4f0"/>
    <text x="730" y="375" fill="#39465b">TOKENS → UI</text>
  </g>
</svg>
