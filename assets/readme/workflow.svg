<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Three modes. One better interface.</title>
  <desc id="desc">Design establishes reusable foundations, Review finds the highest-impact issue, and Guide turns UX principles into surface-specific rules.</desc>
  <defs>
    <linearGradient id="flow-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fbff"/><stop offset="1" stop-color="#edf2fa"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#9ba9bf" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="250" rx="24" fill="url(#flow-bg)"/>
  <text x="48" y="43" fill="#315cda" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="700" letter-spacing="1.7">THREE MODES / ONE SHARED UX FOUNDATION</text>
  <path d="M380 151H417M783 151H820" stroke="#9ba9bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <g transform="translate(30 68)">
      <rect width="350" height="150" rx="16" fill="#fff" stroke="#dce4f0"/>
      <rect x="0.5" y="0.5" width="349" height="4" rx="2" fill="#315cda"/>
      <circle cx="31" cy="37" r="14" fill="#eaf0ff"/><text x="27" y="42" fill="#244899" font-size="13" font-weight="700">01</text>
      <text x="56" y="42" fill="#151a24" font-size="22" font-weight="700">Design</text>
      <text x="22" y="80" fill="#39465b" font-size="17" font-weight="600">Build a system for this product.</text>
      <text x="22" y="106" fill="#687486" font-size="14">Scan → listen → explore → preview</text>
      <rect x="22" y="121" width="148" height="19" rx="9.5" fill="#f0f4fc"/>
      <text x="32" y="135" fill="#315cda" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" font-weight="600">design-spec.md</text>
      <g transform="translate(294 28)" fill="none" stroke="#7892ca" stroke-width="2"><rect width="30" height="37" rx="4"/><path d="M7 10h16M7 17h16M7 24h10"/></g>
    </g>
    <g transform="translate(425 68)">
      <rect width="350" height="150" rx="16" fill="#fff" stroke="#dce4f0"/>
      <rect x="0.5" y="0.5" width="349" height="4" rx="2" fill="#d88925"/>
      <circle cx="31" cy="37" r="14" fill="#fff4e2"/><text x="27" y="42" fill="#956119" font-size="13" font-weight="700">02</text>
      <text x="56" y="42" fill="#151a24" font-size="22" font-weight="700">Review</text>
      <text x="22" y="80" fill="#39465b" font-size="17" font-weight="600">Find what matters most.</text>
      <text x="22" y="106" fill="#687486" font-size="14">Evidence → priority → fix → verify</text>
      <rect x="22" y="121" width="124" height="19" rx="9.5" fill="#fff4e9"/>
      <text x="32" y="135" fill="#965a1c" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" font-weight="600">P0 / P1 / P2</text>
      <g transform="translate(294 31)" fill="none" stroke="#d88925" stroke-width="2"><circle cx="13" cy="13" r="11"/><path d="m21 21 9 9M8 13h10M13 8v10"/></g>
    </g>
    <g transform="translate(820 68)">
      <rect width="350" height="150" rx="16" fill="#fff" stroke="#dce4f0"/>
      <rect x="0.5" y="0.5" width="349" height="4" rx="2" fill="#31805a"/>
      <circle cx="31" cy="37" r="14" fill="#e8f6ee"/><text x="27" y="42" fill="#276641" font-size="13" font-weight="700">03</text>
      <text x="56" y="42" fill="#151a24" font-size="22" font-weight="700">Guide</text>
      <text x="22" y="80" fill="#39465b" font-size="17" font-weight="600">Make principles actionable.</text>
      <text x="22" y="106" fill="#687486" font-size="14">Actions → states → recovery</text>
      <rect x="22" y="121" width="127" height="19" rx="9.5" fill="#edf7f1"/>
      <text x="32" y="135" fill="#276641" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" font-weight="600">DO / DON'T</text>
