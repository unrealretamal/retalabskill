<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Three ways RetaLab Skill improves interface work</title>
  <desc id="desc">Design defines a system, Review prioritizes fixes, and Guide provides rules for a specific interface surface.</desc>
  <rect width="1200" height="240" rx="22" fill="#f7f8fb"/>
  <path d="M380 120h30m380 0h30" stroke="#aebbd0" stroke-width="2" stroke-dasharray="4 6"/>
  <path d="m402 113 9 7-9 7m368-14-9 7 9 7" fill="none" stroke="#71809a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <g transform="translate(28 24)">
      <rect width="352" height="192" rx="18" fill="#ffffff" stroke="#dce4f0"/>
      <circle cx="34" cy="37" r="17" fill="#eaf0ff"/><text x="29" y="43" fill="#244899" font-size="16" font-weight="700">1</text>
      <text x="62" y="44" fill="#151a24" font-size="25" font-weight="700">DESIGN</text>
      <text x="24" y="91" fill="#39465b" font-size="21" font-weight="600">Tailored design system</text>
      <text x="24" y="125" fill="#687486" font-size="18">Scan → listen → preview</text>
      <text x="24" y="165" fill="#315cda" font-size="16" font-weight="600">OUTPUT  design-spec.md</text>
    </g>
    <g transform="translate(424 24)">
      <rect width="352" height="192" rx="18" fill="#ffffff" stroke="#dce4f0"/>
      <circle cx="34" cy="37" r="17" fill="#eaf0ff"/><text x="29" y="43" fill="#244899" font-size="16" font-weight="700">2</text>
      <text x="62" y="44" fill="#151a24" font-size="25" font-weight="700">REVIEW</text>
      <text x="24" y="91" fill="#39465b" font-size="21" font-weight="600">Prioritized interface fixes</text>
      <text x="24" y="125" fill="#687486" font-size="18">Evidence → fix → verify</text>
      <text x="24" y="165" fill="#315cda" font-size="16" font-weight="600">OUTPUT  P0 / P1 / P2</text>
    </g>
    <g transform="translate(820 24)">
      <rect width="352" height="192" rx="18" fill="#ffffff" stroke="#dce4f0"/>
      <circle cx="34" cy="37" r="17" fill="#eaf0ff"/><text x="29" y="43" fill="#244899" font-size="16" font-weight="700">3</text>
      <text x="62" y="44" fill="#151a24" font-size="25" font-weight="700">GUIDE</text>
      <text x="24" y="91" fill="#39465b" font-size="21" font-weight="600">Rules for one surface</text>
      <text x="24" y="125" fill="#687486" font-size="18">Actions → states → help</text>
      <text x="24" y="165" fill="#315cda" font-size="16" font-weight="600">OUTPUT  DO / DON'T</text>
    </g>
  </g>
</svg>
